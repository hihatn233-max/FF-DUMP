name: Build Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        run: |
          brew install ldid xz make
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
      - name: Download SDK
        run: |
          export THEOS=$HOME/theos
          rm -rf $THEOS/sdks
          mkdir -p $THEOS/sdks
          wget -q https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          cp -r sdks-master/*.sdk $THEOS/sdks/
          
      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          make clean
          make
          
      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: FFMenu-dylib
          path: .theos/obj/arm64/FFMenu.dylib
          if-no-files-found: error
