name: Build Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        run: |
          brew install ldid xz make
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
      - name: Download SDK
        run: |
          export THEOS=$HOME/theos
          rm -rf $THEOS/sdks
          git clone https://github.com/theos/sdks.git $THEOS/sdks
          
      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          make clean
          make
          
      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: FFMenu-dylib
          path: .theos/obj/arm64/FFMenu.dylib
          if-no-files-found: error
